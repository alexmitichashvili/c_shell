name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cppcheck

      - name: Build
        run: make

      - name: Static analysis
        run: cppcheck --enable=warning,performance --error-exitcode=1 main.c

      - name: Run tests
        run: make test

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cshell-${{ github.sha }}
          path: cshell
